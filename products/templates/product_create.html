{% extends 'base.html' %}

{% block content %}
  <div class="page-shell">
    <h3 class="display-4">Cadastrar Produto</h3>

    <div class="card">
      <div class="card-body">
        <form method="post" class="demo-inert-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="button" data-demo-inert="true" class="btn btn-primary">Salvar</button>
        </form>
      </div>
    </div>
    <a href="{% url 'product_list' %}" class="btn btn-secondary mt-3">Cancelar e Voltar para a Lista de Produtos</a>
  </div>
{% endblock %}
