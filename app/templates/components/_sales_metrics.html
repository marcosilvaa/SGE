<section class="metric-grid" aria-label="Indicadores de vendas">
  <article class="metric-tile metric-accent-blue">
    <div class="metric-label">Vendas</div>
    <div class="metric-value">{{ sales_metrics.total_sales }}</div>
    <div class="metric-note">Registros de saída</div>
  </article>
  <article class="metric-tile metric-accent-yellow">
    <div class="metric-label">Produtos vendidos</div>
    <div class="metric-value">{{ sales_metrics.total_products_sold }}</div>
    <div class="metric-note">Unidades movimentadas</div>
  </article>
  <article class="metric-tile metric-accent-green">
    <div class="metric-label">Valor vendido</div>
    <div class="metric-value">R$ {{ sales_metrics.total_sales_value }}</div>
    <div class="metric-note">Receita bruta</div>
  </article>
  <article class="metric-tile metric-accent-red">
    <div class="metric-label">Lucro das vendas</div>
    <div class="metric-value">R$ {{ sales_metrics.total_sales_profit }}</div>
    <div class="metric-note">Margem realizada</div>
  </article>
</section>
