{% extends 'base.html' %}

{% block title %}
SGE - Fornecedor
{% endblock %}

{% block content %}

<div class="page-shell">
  <h3 class='display-6'>Cadastrar Fornecedor</h3>

  <div class='card'>
    <div class='card-body'>
      <form method='post' class='form demo-inert-form'>
        {% csrf_token %}
        {{ form.as_p }}
        <button type='button' data-demo-inert='true' class='btn btn-primary mt-3'>Salvar</button>
        <a href="{% url 'supplier_list' %}" class='btn btn-secondary mt-3'>Cancelar</a>
      </form>
    </div>    
  </div>
</div>

{% endblock %}
