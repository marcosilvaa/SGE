{% extends 'base.html' %}

{% block title %}Meu Estoque - Excluir entrada{% endblock %}

{% block content %}
<div class='page-shell'>
  <h3 class='display-6'>Excluir Entrada</h3>
  <div class='card'>
    <div class='card-body'>
      <p class='card-text'>Tem certeza que deseja excluir a entrada de <strong>{{ object.product }}</strong>?</p>
      <form method='post' class='demo-inert-form'>
        {% csrf_token %}
        <button type="button" data-demo-inert="true" class='btn btn-danger mt-3'>Excluir</button>
        <a href="{% url 'inflow_list' %}" class='btn btn-secondary mt-3'>Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
